version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hienhuu_postgres
    environment:
      POSTGRES_USER: hienhuu
      POSTGRES_PASSWORD: hienhuu123
      POSTGRES_DB: hienhuu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hienhuu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
