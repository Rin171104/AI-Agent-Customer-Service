version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hienhuu_postgres
    environment:
      POSTGRES_USER: hienhuu
      POSTGRES_PASSWORD: hienhuu123
      POSTGRES_DB: hienhuu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hienhuu"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hienhuu_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://hienhuu:hienhuu123@postgres:5432/hienhuu_db
      - SECRET_KEY=hienhuu-secret-key-change-in-production
      - CORS_ORIGINS=["http://localhost","http://frontend:80"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hienhuu_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
